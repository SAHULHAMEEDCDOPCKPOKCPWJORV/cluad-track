# nginx in front of the app containers when self-hosting (docker-compose.yml).
# It is the reverse proxy and the load balancer:
#  - spreads requests over every app container (least busy first) and skips a container that fails,
#  - service discovery: finds the containers by their Docker service name "app" and re-checks it every 10 s,
#    so scaling up or down (docker compose up --scale app=5) needs no config change,
#  - passes the visitor's real IP address on, which the app's rate limits rely on,
#  - compresses responses, caches the app's static files, and adds a sign-in rate limit at the front door.
# On Vercel none of this file is used: Vercel's own edge network does these jobs.

worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 8m;   # same limit as the app's API gateway

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

  # Docker's built-in DNS: used to find the app containers (service discovery).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Front-door rate limits per visitor IP (the app adds its own, shared limits behind these).
  limit_req_zone $binary_remote_addr zone=signin:10m rate=20r/m;
  limit_req_zone $binary_remote_addr zone=api:10m    rate=20r/s;
  limit_req_status 429;

  # Static app files never change once published (their names contain a hash), so nginx keeps a copy.
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:20m max_size=500m inactive=7d use_temp_path=off;

  upstream app {
    zone app 64k;
    least_conn;
    server app:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;   # overwrite anything the visitor sent
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    # If one container fails, safely retry the request on another one (GET/HEAD only by default).
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = /api/auth/login {
      limit_req zone=signin burst=5 nodelay;
      proxy_pass http://app;
    }
    location ~ ^/api/projects/[^/]+/(unlock|password)$ {
      limit_req zone=signin burst=10 nodelay;
      proxy_pass http://app;
    }
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://app;
    }
    location /_next/static/ {
      proxy_cache static;
      proxy_cache_valid 200 7d;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache $upstream_cache_status;
      proxy_pass http://app;
    }
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }
    location / {
      proxy_pass http://app;
    }
  }
}

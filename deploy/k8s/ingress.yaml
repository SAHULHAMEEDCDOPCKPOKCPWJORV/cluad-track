# Reverse proxy at the edge of the cluster (ingress-nginx): HTTPS, a front-door rate limit, real client IP,
# 8 MB upload limit, and sticky-free load balancing over the app Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swelect-app
  namespace: swelect
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/load-balance: "ewma"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503 http_504"
    cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["projects.example.com"]
      secretName: swelect-tls
  rules:
    - host: projects.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: swelect-app, port: { name: http } }

# The app: 3 copies to start (the autoscaler adds more under load), replaced one at a time on updates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swelect-app
  namespace: swelect
  labels: { app: swelect-app }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: swelect-app }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # no downtime during an update
  template:
    metadata:
      labels: { app: swelect-app }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001 }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: swelect-app } }
      containers:
        - name: app
          # Build and push with: docker build -t <registry>/swelect-project-control:<tag> . && docker push ...
          image: ghcr.io/sahulhameedcdopckpokcpwjorv/swelect-project-control:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: swelect-config }
            - secretRef: { name: swelect-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:          # restart a copy that stops answering
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:         # only send traffic to copies that can reach the database
            httpGet: { path: "/api/health?ready=1", port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#090d16" />
<title>Offline · SWELECT Project Control</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090d16; color: #e2e8f0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  .card { max-width: 360px; margin: 24px; padding: 32px 28px; text-align: center; border: 1px solid #1e293b; border-radius: 16px; background: #0b111c; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { margin: 16px 0 6px; font-size: 20px; color: #fff; }
  p { margin: 0 0 20px; color: #94a3b8; }
  button { padding: 10px 20px; border: 0; border-radius: 10px; background: #f59e0b; color: #111; font-weight: 700; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>SWELECT Project Control needs the internet to show live project data. It will load again as soon as you're connected.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>

# Self-hosted setup: 3 app containers behind nginx (reverse proxy + load balancer).
#   1. cp deploy/env.example .env.production   and fill in the values (never commit that file)
#   2. docker compose up -d --build
#   3. open http://localhost   (scale with: docker compose up -d --scale app=5)
# The live site does NOT use this: it runs on Vercel. This is for running the app on your own server.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: swelect-project-control:latest
    env_file: .env.production
    deploy:
      replicas: 3
    restart: unless-stopped
    expose:
      - "3000"
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
